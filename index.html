<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物品碼查詢</title>
<meta name="theme-color" content="#f4f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物品碼">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* =========================================================
   物品碼查詢 v2.0
   ========================================================= */
:root{
  --bg:#f4f5f1; --card:#ffffff; --text:#1f2723; --sub:#5f6a64; --muted:#8a948e; --line:#e3e5df; --line2:#dadcd5;
  --sage:#4e7a66; --sage-dark:#3f6655; --sage-soft:#e4eee8; --sage-text:#2f5a47; --sage-line:#c9d7cf;
  --sand:#f4ede1; --sand-line:#e5d6bd; --sand-text:#6b4e24;
  --gray-soft:#ecece7; --gray-text:#4a4d47;
  --gold-soft:#f7efd9; --gold-line:#e8d59e; --gold-text:#7a5b12;
  --red:#a83a32; --red-soft:#f8e6e3;
  --radius:18px;
  --shadow:0 1px 2px rgba(31,39,35,.05),0 3px 10px rgba(31,39,35,.04);
}
html{font-size:20px;-webkit-text-size-adjust:100%}
html.fs-xl{font-size:23px}
@media (max-width:600px){ html{font-size:17px} html.fs-xl{font-size:19px} }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  line-height:1.5;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #9cc2b0;outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em;flex-shrink:0}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- 頂部 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(244,245,241,.95);
  backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px);
  padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.topbar h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:.03em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsSeg{display:inline-flex;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.fsSeg button{padding:.25rem .8rem;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--sub)}
.fsSeg button.on{background:var(--sage);color:#fff}
.pill-btn{background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:.3rem .9rem;font-size:.8rem;font-weight:700;color:var(--sub);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}

/* ---------- 搜尋 ---------- */
.searchrow{display:flex;gap:10px;padding-bottom:12px}
.searchbox{flex:1;min-width:0;display:flex;align-items:center;background:var(--card);
  border-radius:var(--radius);border:2px solid var(--line2);min-height:68px}
.searchbox:focus-within{border-color:var(--sage)}
.searchbox .si{font-size:1.25rem;margin-left:18px;color:var(--muted)}
#q{flex:1;border:0;outline:0;background:none;font:inherit;font-size:1.25rem;padding:14px 12px;min-width:0;color:var(--text)}
#q::placeholder{color:#a1a9a4}
#q::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
#clearBtn{width:46px;height:46px;margin-right:10px;border-radius:50%;background:var(--gray-soft);color:var(--sub);font-size:1.05rem;display:none;align-items:center;justify-content:center}
#clearBtn.show{display:flex}
#micBtn{width:68px;min-height:68px;border-radius:var(--radius);background:var(--sage);color:#fff;font-size:1.6rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#micBtn:hover{background:var(--sage-dark)}
#micBtn.listening{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,58,50,.4)}70%{box-shadow:0 0 0 14px rgba(168,58,50,0)}100%{box-shadow:0 0 0 0 rgba(168,58,50,0)}}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:.4rem 1.05rem;border-radius:999px;background:var(--card);font-size:.85rem;font-weight:700;color:var(--sub);border:1px solid var(--line2)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}

/* ---------- 內容 ---------- */
main{padding-top:2px}
.status{color:var(--sub);font-size:.8rem;margin:2px 4px 12px}
.section-title{font-size:.95rem;font-weight:800;margin:16px 4px 10px;color:var(--sub)}
.banner{background:var(--sand);color:var(--sand-text);border:1px solid var(--sand-line);border-radius:14px;padding:10px 16px;font-size:.85rem;margin-bottom:12px}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 20px 18px;margin-bottom:14px}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.tag{font-size:.75rem;font-weight:700;padding:.2rem .8rem;border-radius:999px;white-space:nowrap}
.tag.consume{background:var(--sage-soft);color:var(--sage-text)}
.tag.purchase{background:var(--gray-soft);color:var(--gray-text)}
.tag.local{background:var(--sand);color:var(--sand-text);margin-left:6px}
.favbtn{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:.35rem .85rem;border-radius:999px;
  border:1px solid var(--line2);background:#fff;color:var(--sub);white-space:nowrap}
.favbtn:hover{border-color:var(--gold-line)}
.favbtn.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold-text)}
.favbtn.on svg.i{fill:currentColor}
.coderow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.code{flex:1;min-width:150px}
.code small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.code b{display:block;font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:1.6rem;font-weight:800;letter-spacing:.06em;word-break:break-all;line-height:1.25}
.copybtn{background:var(--sage);color:#fff;font-size:1.02rem;font-weight:800;padding:.8rem 1.5rem;border-radius:14px;min-height:58px;white-space:nowrap}
.copybtn:hover{background:var(--sage-dark)}
.copybtn:active{transform:scale(.97)}
.name{font-size:1.02rem;font-weight:600;line-height:1.5;margin:8px 0 0;word-break:break-word}
.name mark{background:#f6e7b0;color:inherit;border-radius:4px;padding:0 2px}
.deptrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.dept{display:inline-flex;align-items:baseline;gap:6px;font-size:.88rem;font-weight:700;padding:.4rem .9rem;border-radius:12px;
  background:var(--sand);color:var(--sand-text);border:1px solid var(--sand-line)}
.dept b{font-size:1.05rem;letter-spacing:.04em;font-weight:800}
button.dept:hover{border-color:#d4bf9c}
.dept.none{background:#fafaf8;color:var(--muted);border-style:dashed;border-color:var(--line2)}
.editbtn{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;color:var(--sage-text);padding:.42rem .8rem;border-radius:12px;border:1px solid var(--sage-line);background:#fff}
.editbtn:hover{background:var(--sage-soft)}
.more{text-align:center;color:var(--sub);padding:12px;font-size:.85rem}

.empty{text-align:center;padding:36px 16px;color:var(--sub)}
.empty .big{font-size:2.6rem;color:var(--sage-line)}
.examples{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.examples button{background:var(--card);padding:.55rem 1.2rem;border-radius:12px;font-weight:700;border:1px solid var(--line2);color:var(--sage-text)}

/* ---------- 底部分頁 ---------- */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar .wrap{display:flex}
nav.tabbar button{flex:1;padding:9px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
nav.tabbar button .ic{font-size:1.45rem;height:1.6rem;display:flex;align-items:center;justify-content:center;position:relative}
nav.tabbar button.on{color:var(--sage)}
nav.tabbar button.locked{color:#b4bab6}
nav.tabbar .lock{position:absolute;right:-.55rem;bottom:-.1rem;font-size:.75rem;background:#fff;border-radius:50%}

.page{display:none}.page.on{display:block}

/* ---------- 表單 ---------- */
.form .card{padding:22px}
.field{margin-bottom:20px}
.field label,.field .lbl{display:block;font-weight:800;margin-bottom:8px;font-size:.95rem}
.field .hint{font-size:.75rem;color:var(--muted);font-weight:600;margin-left:6px}
.field input{width:100%;font:inherit;font-size:1.1rem;padding:15px 18px;border-radius:14px;border:2px solid var(--line2);background:#fbfbf9;color:var(--text)}
.field input:focus{border-color:var(--sage);outline:0;background:#fff}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:140px;padding:15px 10px;border-radius:14px;border:2px solid var(--line2);background:#fbfbf9;font-weight:800}
.seg button.on{border-color:var(--sage);background:var(--sage-soft);color:var(--sage-text)}
.bigbtn{width:100%;background:var(--sage);color:#fff;font-size:1.1rem;font-weight:800;padding:16px;border-radius:16px;min-height:62px}
.bigbtn:hover{background:var(--sage-dark)}
.bigbtn.gray{background:var(--gray-soft);color:var(--text)}
.bigbtn:disabled{opacity:.55}
.msg{border-radius:12px;padding:12px 16px;margin-bottom:16px;font-weight:700;display:none}
.msg.show{display:block}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--sage-soft);color:var(--sage-text)}

/* ---------- 提示 ---------- */
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);
  background:var(--sage-dark);color:#fff;font-size:1.1rem;font-weight:800;padding:16px 28px;border-radius:18px;
  box-shadow:0 10px 30px rgba(31,39,35,.25);opacity:0;pointer-events:none;transition:.22s;z-index:100;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast small{display:block;font-size:.9rem;font-weight:700;opacity:.9;margin-top:2px;font-family:"SF Mono",Consolas,monospace;letter-spacing:.05em}

#listen{position:fixed;inset:0;background:rgba(31,39,35,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
#listen.show{display:flex}
#listen .box{background:#fff;border-radius:26px;padding:30px;text-align:center;width:min(420px,100%)}
#listen .mic{font-size:3rem;color:var(--muted);border-radius:50%;width:104px;height:104px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;background:var(--gray-soft);transition:.2s}
#listen.ready .mic{color:var(--red);background:var(--red-soft);animation:pulse 1.2s infinite}
#listen .say{font-size:1.15rem;font-weight:800;color:var(--muted)}
#listen.ready .say{color:var(--red)}
body.desktop #micBtn{display:none}
#listen .heard{font-size:1.25rem;font-weight:800;min-height:2em;margin:8px 0 18px;color:var(--sage-text)}

dialog{border:0;border-radius:24px;padding:24px;width:min(520px,92vw);box-shadow:0 20px 60px rgba(31,39,35,.3);color:var(--text)}
dialog::backdrop{background:rgba(31,39,35,.4)}
dialog h2{margin:0 0 10px;font-size:1.2rem}
dialog p{color:var(--sub);margin:6px 0}
dialog .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
dialog .row button{flex:1;min-width:120px}
dialog .seg{margin:12px 0}
dialog .field{margin:0}
.bigbtn.danger{background:var(--red)}
.bigbtn.danger:hover{background:#8f2f28}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:.95rem;font-weight:700}
.setrow .link{font-size:.85rem;font-weight:800;padding:.45rem .9rem;border-radius:10px;border:1px solid var(--line2);background:#fff}
.setrow .link.red{color:var(--red);border-color:#e7c3be}
.setrow .link.green{color:var(--sage-text);border-color:var(--sage-line)}
.switch{width:3rem;height:1.7rem;border-radius:999px;background:#cfd3cd;position:relative;flex-shrink:0;transition:.2s}
.switch::after{content:'';position:absolute;left:.2rem;top:.2rem;width:1.3rem;height:1.3rem;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--sage)}
.switch.on::after{left:1.5rem}
.setinfo{font-size:.75rem;color:var(--muted);margin-top:14px;line-height:1.8}
.listhead{display:flex;align-items:center;justify-content:space-between;margin:6px 4px 4px}
.listhead span{font-size:.9rem;font-weight:800;color:var(--sub)}
.clearbtn{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:800;color:var(--red);padding:.4rem .85rem;border-radius:10px;border:1px solid #e7c3be;background:#fff}
.clearbtn:hover{background:var(--red-soft)}
</style>
</head>
<body>

<!-- 線條圖示 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>

<header>
  <div class="wrap">
    <div class="topbar">
      <h1>物品碼查詢</h1>
      <button class="pill-btn" id="setBtn"><svg class="i"><use href="#i-gear"/></svg>設定</button>
    </div>
    <div id="searchArea">
      <div class="searchrow">
        <div class="searchbox">
          <svg class="i si"><use href="#i-search"/></svg>
          <input id="q" type="search" placeholder="輸入品名或語音搜尋" autocomplete="off" enterkeyhint="search" aria-label="輸入品名或語音搜尋">
          <button id="clearBtn" aria-label="清除"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <button id="micBtn" aria-label="語音搜尋"><svg class="i"><use href="#i-mic"/></svg></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 查詢頁 -->
  <section class="page on" id="page-search">
    <div id="banner"></div>
    <div class="status" id="status"></div>
    <div id="results"></div>
  </section>

  <!-- 新增頁 -->
  <section class="page form" id="page-add">
    <h2 style="margin:14px 4px 10px">新增物品</h2>
    <div class="msg" id="addMsg"></div>
    <div class="card">
      <div class="field">
        <label for="fCode">物品碼 <span class="hint">必填</span></label>
        <input id="fCode" autocomplete="off" autocapitalize="characters">
      </div>
      <div class="field">
        <label for="fName">品名 <span class="hint">必填</span></label>
        <input id="fName" autocomplete="off">
      </div>
      <div class="field">
        <span class="lbl">HIS 功能</span>
        <div class="seg" id="fSource">
          <button data-v="消耗性材料耗用" class="on">消耗性材料耗用</button>
          <button data-v="採購請購">採購請購</button>
        </div>
      </div>
      <div class="field" id="deptField">
        <label for="fDept">發貨部門</label>
        <div class="seg deptQuick" style="margin-bottom:10px">
          <button type="button" data-dq="8322 醫材庫">8322 醫材庫</button>
          <button type="button" data-dq="8326 重物倉">8326 重物倉</button>
        </div>
        <input id="fDept" autocomplete="off" aria-label="其他發貨部門代號">
      </div>
      <button class="bigbtn" id="saveBtn">儲存</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <div class="wrap">
    <button data-page="search" class="on"><span class="ic"><svg class="i"><use href="#i-search"/></svg></span>查詢</button>
    <button data-page="add" class="add"><span class="ic"><svg class="i"><use href="#i-plus"/></svg></span>新增物品</button>
    <button data-page="inv" class="locked"><span class="ic"><svg class="i"><use href="#i-list"/></svg><svg class="i lock"><use href="#i-lock"/></svg></span>盤點</button>
  </div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<div id="listen" role="dialog" aria-label="語音輸入中">
  <div class="box">
    <div class="mic"><svg class="i"><use href="#i-mic"/></svg></div>
    <div class="say" id="say">準備中…</div>
    <div class="heard" id="heard"></div>
    <button class="bigbtn gray" id="stopListen">停止</button>
  </div>
</div>

<dialog id="dlg"></dialog>

<!-- 試算表網址放在 config.js -->
<script src="config.js"></script>
<!-- 中文同音字比對（語音辨識打錯字時用），載入失敗也不影響基本功能 -->
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js" defer></script>

<script>
const CONFIG = Object.assign({ API_URL: '' }, window.APP_CONFIG || {});
const VERSION = 'v3.1';
const SRC_CONSUME = '消耗性材料耗用', SRC_PURCHASE = '採購請購';

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = id => `<svg class="i"><use href="#i-${id}"/></svg>`;
function norm(s){
  return String(s ?? '')
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, ' ')
    .toLowerCase()
    .replace(/[\s\-_.,，、。()（）\[\]【】\/\\*;；:：'"＂“”#+&]/g, '');
}

/* ---------- 資料 ---------- */
let ITEMS = [];
let filter = 'all';
let lastSource = '';

function parseDept(s){
  s = String(s || '').split(/[；;]/)[0].trim();      // 只取第一個發貨部門
  if (!s) return null;
  const m = s.match(/^(\S+)\s*(.*)$/);
  return { code:m[1], name:m[2] || '' };
}
function toItem(r){
  const g = k => String(r[k] ?? '').trim();
  const src = g('來源');
  const it = {
    code:g('物品碼'), name:g('品名'),
    kind: (src === '消耗性物品' || src === SRC_CONSUME) ? 'consume' : 'purchase',
    dept: parseDept(g('發貨部門')),
    alias:g('別名'), old:g('舊品名'), local:!!r._local,
  };
  it.codeN = norm(it.code);
  it.hay = norm([it.code, it.name, it.alias, it.old, it.dept ? it.dept.code + it.dept.name : ''].join(' '));
  it.py = null;
  return it;
}
function setData(rows){
  const local = store.get('local_items', []);
  const seen = new Set(rows.map(r => String(r['物品碼']).trim()));
  const all = rows.concat(local.filter(r => !seen.has(String(r['物品碼']).trim())).map(r => ({...r, _local:true})));
  ITEMS = all.filter(r => String(r['物品碼'] ?? '').trim()).map(toItem);
  buildPinyin();
  renderChips(); render();
}
function cacheRows(){ return (store.get('items_cache', null) || { items:[] }).items; }

async function loadData(){
  const cache = store.get('items_cache', null);
  if (cache && cache.items) { lastSource = cache.when; setData(cache.items); }
  const url = CONFIG.API_URL || 'items.json';
  try {
    const res = await fetch(url, { cache:'no-store' });
    const data = await res.json();
    if (!data.items) throw new Error('no items');
    const when = new Date().toLocaleString('zh-TW', { hour12:false });
    store.set('items_cache', { items:data.items, when });
    lastSource = when;
    setData(data.items);
    $('#banner').innerHTML = CONFIG.API_URL ? '' :
      '<div class="banner">尚未連接 Google 試算表，目前使用內建資料。新增和編輯只會存在這台電腦。</div>';
  } catch (e) {
    $('#banner').innerHTML = '<div class="banner">暫時連不上資料庫，先使用上次的資料' + (lastSource ? '（' + esc(lastSource) + '）' : '') + '。</div>';
    if (!cache) setData([]);
  }
}

/* ---------- 同音字（拼音）比對 ---------- */
const pyCache = new Map();
function charPy(ch){
  if (!window.pinyinPro) return null;
  if (!pyCache.has(ch)) {
    try { pyCache.set(ch, pinyinPro.pinyin(ch, { toneType:'none', type:'array', multiple:true })); }
    catch(e){ pyCache.set(ch, []); }
  }
  return pyCache.get(ch);
}
function buildPinyin(){
  if (!window.pinyinPro) return;
  ITEMS.forEach(it => {
    const set = new Set();
    for (const ch of (it.name + it.alias + it.old)) if (/[一-鿿]/.test(ch)) (charPy(ch) || []).forEach(p => set.add(p));
    it.py = set;
  });
}
window.addEventListener('load', () => {
  const t = setInterval(() => { if (window.pinyinPro) { clearInterval(t); buildPinyin(); if ($('#q').value) render(); } }, 300);
  setTimeout(() => clearInterval(t), 15000);
});

/* ---------- 搜尋 ---------- */
const units = qn => qn.match(/[a-z0-9]+|[^\sa-z0-9]/g) || [];
function scoreItem(it, tokens, qn){
  if (it.codeN === qn) return 1000;
  if (it.codeN.startsWith(qn) && qn.length >= 2) return 800 + qn.length;
  if (tokens.every(t => it.hay.includes(t))) {
    let s = 500;
    if (norm(it.name).includes(qn)) s += 60;
    if (norm(it.alias).includes(qn)) s += 50;
    return s - Math.min(it.name.length, 80) / 10;
  }
  const us = units(qn);
  let total = 0, exact = 0, sound = 0;
  for (const u of us) {
    const isAscii = /^[a-z0-9]+$/.test(u);
    const w = isAscii ? Math.min(u.length, 4) : 1;
    total += w;
    if (it.hay.includes(u)) { exact += w; continue; }
    if (!isAscii && it.py) {
      const p = charPy(u);
      if (p && p.some(x => it.py.has(x))) sound += w * 0.7;
    }
  }
  if (total < 2 || exact / total < 0.5) return 0;
  const ratio = (exact + sound) / total;
  return ratio >= 0.6 ? Math.round(ratio * 300) : 0;
}
// 目前分類裡的物品（常用、最近複製依照存放的順序）
function poolItems(){
  if (filter === 'fav' || filter === 'recent') {
    const byCode = new Map(ITEMS.map(it => [it.code, it]));
    return store.get(filter === 'fav' ? 'favs' : 'recent', []).map(c => byCode.get(c)).filter(Boolean);
  }
  return ITEMS.filter(it => filter === 'all' || it.kind === filter);
}
function search(q){
  const qn = norm(q);
  if (!qn) return null;
  const tokens = q.split(/\s+/).map(norm).filter(Boolean);
  const favs = new Set(store.get('favs', []));
  let list = poolItems()
    .map(it => ({ it, base: scoreItem(it, tokens, qn) }))
    .filter(x => x.base > 0);
  if (list.some(x => x.base >= 400)) list = list.filter(x => x.base >= 270);
  return list
    .map(x => ({ it: x.it, s: x.base + (favs.has(x.it.code) ? 30 : 0) }))
    .sort((a, b) => b.s - a.s || (a.it.kind === 'consume' ? -1 : 1) - (b.it.kind === 'consume' ? -1 : 1)
      || (a.it.code.startsWith('*') ? 1 : 0) - (b.it.code.startsWith('*') ? 1 : 0) || a.it.code.localeCompare(b.it.code))
    .map(x => x.it);
}

/* ---------- 畫面 ---------- */
function highlight(text, q){
  let html = esc(text);
  const words = q.split(/\s+/).filter(Boolean).sort((a,b) => b.length - a.length);
  for (const w of words) {
    const re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    html = html.replace(re, '<mark>$1</mark>');
  }
  return html;
}
function favHTML(code, on){
  return `<button class="favbtn ${on ? 'on' : ''}" data-fav="${esc(code)}">${icon('star')}${on ? '已加入常用' : '加入常用'}</button>`;
}
function cardHTML(it, q){
  const fav = store.get('favs', []).includes(it.code);
  const label = it.kind === 'consume' ? SRC_CONSUME : SRC_PURCHASE;
  let deptHTML = '';
  if (it.kind === 'consume') {
    deptHTML = `<div class="deptrow">` +
      (it.dept
        ? `<button class="dept" data-copy-dept="${esc(it.dept.code)}" title="點一下複製發貨部門代號">發貨部門 <b>${esc(it.dept.code)}</b> ${esc(it.dept.name)}</button>`
        : `<span class="dept none">發貨部門：未填</span>`) +
      `<button class="editbtn" data-edit-dept="${esc(it.code)}">${icon('edit')}編輯</button></div>`;
  }
  return `<article class="card">
    <div class="card-top">
      <div><span class="tag ${it.kind}">${label}</span>${it.local ? '<span class="tag local">只存在這台電腦</span>' : ''}</div>
      ${favHTML(it.code, fav)}
    </div>
    <div class="coderow">
      <div class="code"><small>物品碼</small><b>${esc(it.code)}</b></div>
      <button class="copybtn" data-copy="${esc(it.code)}">複製物品碼</button>
    </div>
    <div class="name">${q ? highlight(it.name, q) : esc(it.name)}</div>
    ${deptHTML}
  </article>`;
}
function renderChips(){
  const list = [['all','全部'],['consume',SRC_CONSUME],['purchase',SRC_PURCHASE],['fav','常用'],['recent','最近複製']];
  $('#chips').innerHTML = list.map(([k, l]) =>
    `<button class="chip ${filter === k ? 'on' : ''}" data-filter="${k}">${l}</button>`).join('');
}
const MAX = 60;
function render(){
  const q = $('#q').value.trim();
  $('#clearBtn').classList.toggle('show', !!q);
  const res = search(q);
  if (res === null) { renderHome(); return; }
  $('#status').textContent = res.length ? `找到 ${res.length} 項` : '';
  if (!res.length) { $('#results').innerHTML = '<div class="empty">找不到符合的物品</div>'; return; }
  $('#results').innerHTML = res.slice(0, MAX).map(it => cardHTML(it, q)).join('') +
    (res.length > MAX ? `<div class="more">還有 ${res.length - MAX} 項，請多打幾個字縮小範圍</div>` : '');
}
// 沒有輸入文字時：一般分類保持空白；常用、最近複製列出清單
function renderHome(){
  $('#status').textContent = ITEMS.length ? '' : '資料載入中…';
  if (filter !== 'fav' && filter !== 'recent') { $('#results').innerHTML = ''; return; }
  const list = poolItems();
  const title = filter === 'fav' ? '常用' : '最近複製';
  if (!list.length) {
    $('#results').innerHTML = `<div class="empty">${filter === 'fav' ? '還沒有常用物品' : '還沒有複製紀錄'}</div>`;
    return;
  }
  $('#results').innerHTML =
    `<div class="listhead"><span>${title}（${list.length} 項）</span>` +
    (filter === 'recent' ? `<button class="clearbtn" id="clearRecent">${icon('trash')}清空紀錄</button>` : '') +
    `</div>` + list.map(it => cardHTML(it, '')).join('');
}

/* ---------- 複製 ---------- */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
let toastTimer;
function toast(main, sub, color){
  const t = $('#toast');
  t.style.background = color || '';
  t.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// 用滑鼠的電腦：隱藏麥克風，搜尋框只寫「搜尋品名」
const IS_DESKTOP = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  document.body.classList.add('desktop');

let rec = null;
function stopUI(){ rec = null; $('#listen').classList.remove('show', 'ready'); $('#micBtn').classList.remove('listening'); }
$('#micBtn').addEventListener('click', () => {
  if (!SR) { dialog('這台裝置不支援語音搜尋', '<p>可以改用鍵盤上的麥克風：點一下搜尋框，再按鍵盤上的麥克風說話。</p>'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = 'zh-TW'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  $('#heard').textContent = '';
  $('#say').textContent = '準備中…'; $('#listen').classList.remove('ready');
  $('#listen').classList.add('show'); $('#micBtn').classList.add('listening');
  let readyTimer;
  const ready = () => { clearTimeout(readyTimer); $('#listen').classList.add('ready'); $('#say').textContent = '請說話'; };
  rec.onaudiostart = ready;                         // 麥克風真正開始收音
  rec.onstart = () => { readyTimer = setTimeout(ready, 600); };   // 部分瀏覽器沒有 audiostart
  rec.onresult = ev => {
    let txt = '';
    for (const r of ev.results) txt += r[0].transcript;
    txt = txt.replace(/[。，,.！？]$/, '');
    $('#heard').textContent = txt;
    $('#q').value = txt; render();
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed')
      dialog('沒有麥克風權限', '<p>請點網址列左邊的圖示，把「麥克風」設成允許，再按一次麥克風。</p>');
    else if (ev.error === 'network') toast('語音需要連上網路', '', '#a83a32');
    else if (ev.error === 'audio-capture') dialog('找不到麥克風', '<p>這台電腦可能沒有接麥克風，請直接打字搜尋。</p>');
  };
  rec.onend = stopUI;
  try { rec.start(); } catch (e) { stopUI(); }
});

function patchCache(code, field, value){
  const c = store.get('items_cache', null);
  if (c && c.items) { const r = c.items.find(x => String(x['物品碼']).trim() === code); if (r) { r[field] = value; store.set('items_cache', c); } }

     <div class="field"><label for="dOther" style="font-size:.85rem">其他代號</label><input id="dOther" autocomplete="off" value="${quick.includes(cur) ? '' : esc(cur)}"></div>

      if (/^\d+$/.test(dept)) {                       // 只打代號 → 自動補上名稱

        } catch (e) { const m = $('#dMsg'); m.textContent = '連不上 Google 試算表，請確認網路後再試一次'; m.className = 'msg show err'; return false; }
      }
      patchCache(code, '發貨部門', dept);

      render();

  $('#deptField').style.display = fSource === SRC_CONSUME ? '' : 'none';
});
$('#deptField .deptQuick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $('#fDept').value = '';
  $$('#deptField .deptQuick button').forEach(x => x.classList.toggle('on', x === b));
});
$('#fDept').addEventListener('input', () => $$('#deptField .deptQuick button').forEach(x => x.classList.remove('on')));
function addMsg(text, ok){ const m = $('#addMsg'); m.textContent = text; m.className = 'msg show ' + (ok ? 'ok' : 'err'); window.scrollTo(0, 0); }

$('#saveBtn').addEventListener('click', async () => {
  const code = $('#fCode').value.trim().toUpperCase().replace(/\s+/g, '');
  const name = $('#fName').value.trim();
  if (!code || !name) { addMsg('請填寫「物品碼」和「品名」'); return; }
  const exist = ITEMS.find(it => it.code === code);
  if (exist && !confirm(`物品碼 ${code} 已經有了：\n${exist.name}\n\n要用新的資料更新它嗎？`)) return;

  let dept = '';
  if (fSource === SRC_CONSUME) {
    const q = $('#deptField .deptQuick button.on');
    dept = $('#fDept').value.trim() || (q ? q.dataset.dq : '');
    if (/^\d+$/.test(dept)) {
      const known = ITEMS.map(x => x.dept).find(d => d && d.code === dept && d.name);
      if (known) dept = known.code + ' ' + known.name;
    }
  }
  const item = { '物品碼':code, '品名':name, '來源':fSource, '發貨部門':dept };

  if (!CONFIG.API_URL) {
    const local = store.get('local_items', []).filter(r => r['物品碼'] !== code);
    local.push(item); store.set('local_items', local);
    finishAdd(code, '已儲存在這台電腦');
    setData(cacheRows());
    return;
  }
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '儲存中…';
  try {
    const data = await post({ action:'addItem', item });
    if (!data.ok) { addMsg(data.error || '儲存失敗'); return; }
    finishAdd(code, data.updated ? '已更新到 Google 試算表' : '已新增到 Google 試算表');
    loadData();
  } catch (e) {
    addMsg('連不上 Google 試算表，請確認網路後再試一次');
  } finally {
    $('#saveBtn').disabled = false; $('#saveBtn').textContent = '儲存';
  }
});
function finishAdd(code, text){
  ['#fCode', '#fName', '#fDept'].forEach(s => $(s).value = '');
  $$('#deptField .deptQuick button').forEach(x => x.classList.remove('on'));
  toast(text, code);
  addMsg(text + '：' + code, true);
}

/* ---------- 啟動 ---------- */
loadData();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
