<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物品碼查詢</title>
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="物品碼">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* =========================================================
   物品碼查詢 v1.0
   ========================================================= */
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --sub:#5e5e66; --line:#e3e3e8;
  --blue:#0a66d9; --blue-soft:#e6f0ff;
  --green:#1d7a3c; --green-soft:#e2f6e8;
  --purple:#6a3fb3; --purple-soft:#efe7ff;
  --orange:#9a4d00; --orange-soft:#fff0dc;
  --red:#c62828; --red-soft:#ffe8e8;
  --radius:22px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
html{font-size:20px;-webkit-text-size-adjust:100%}
html.fs-l{font-size:23px}
html.fs-xl{font-size:26px}
@media (max-width:600px){
  html{font-size:17px} html.fs-l{font-size:19px} html.fs-xl{font-size:21px}
  .topbar h1{font-size:1.3rem}
  .code{font-size:1.5rem;min-width:0}
  .copybtn{flex:1 1 100%}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;
  line-height:1.5;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #7fb2ff;outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* ---------- 頂部 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(242,242,247,.94);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  padding-top:env(safe-area-inset-top)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.topbar h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-btn{background:var(--card);border-radius:999px;padding:.35rem .9rem;font-size:.85rem;font-weight:600;
  box-shadow:var(--shadow);color:var(--sub);white-space:nowrap}

/* ---------- 搜尋 ---------- */
.searchrow{display:flex;gap:10px;padding-bottom:12px}
.searchbox{flex:1;min-width:0;position:relative;display:flex;align-items:center;background:var(--card);
  border-radius:var(--radius);box-shadow:var(--shadow);border:2px solid transparent;min-height:72px}
.searchbox:focus-within{border-color:var(--blue)}
.searchbox .ico{font-size:1.3rem;padding-left:18px;opacity:.55}
#q{flex:1;border:0;outline:0;background:none;font:inherit;font-size:1.3rem;padding:14px 12px;min-width:0;color:var(--text)}
#q::placeholder{color:#9a9aa2}
#q::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
#clearBtn{font-size:1.1rem;width:52px;height:52px;margin-right:8px;border-radius:50%;background:#e9e9ee;color:#666;display:none}
#clearBtn.show{display:block}
#micBtn{width:72px;min-height:72px;border-radius:var(--radius);background:var(--blue);color:#fff;font-size:1.6rem;box-shadow:var(--shadow);flex-shrink:0}
#micBtn.listening{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,40,40,.45)}70%{box-shadow:0 0 0 16px rgba(198,40,40,0)}100%{box-shadow:0 0 0 0 rgba(198,40,40,0)}}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:.45rem 1rem;border-radius:999px;background:var(--card);font-size:.9rem;font-weight:600;color:var(--sub);box-shadow:var(--shadow)}
.chip.on{background:var(--text);color:#fff}
.chip .n{opacity:.6;font-weight:500;margin-left:4px}

/* ---------- 內容 ---------- */
main{padding-top:4px}
.status{color:var(--sub);font-size:.85rem;margin:4px 4px 12px}
.section-title{font-size:1.05rem;font-weight:800;margin:18px 4px 10px;color:var(--sub)}
.banner{background:var(--orange-soft);color:var(--orange);border-radius:16px;padding:12px 16px;font-size:.9rem;margin-bottom:12px}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.tag{font-size:.8rem;font-weight:700;padding:.2rem .75rem;border-radius:999px}
.tag.consume{background:var(--green-soft);color:var(--green)}
.tag.supply{background:var(--blue-soft);color:var(--blue)}
.tag.drug{background:var(--purple-soft);color:var(--purple)}
.tag.local{background:#eee;color:#666}
.dept{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;font-weight:700;padding:.35rem .85rem;
  border-radius:12px;background:var(--orange-soft);color:var(--orange);border:2px solid #ffd9a8}
.dept b{font-size:1.15rem;letter-spacing:.04em}
.name{font-size:1.15rem;font-weight:700;line-height:1.45;margin:2px 0 6px;word-break:break-word}
.name mark{background:#fff3a0;color:inherit;border-radius:4px;padding:0 2px}
.alias{font-size:.85rem;color:var(--sub);margin-bottom:8px}
.coderow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.code{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:1.65rem;font-weight:800;letter-spacing:.06em;
  flex:1;min-width:150px;word-break:break-all}
.code small{display:block;font-family:inherit;font-size:.75rem;letter-spacing:0;font-weight:600;color:var(--sub)}
.copybtn{background:var(--blue);color:#fff;font-size:1.1rem;font-weight:800;padding:.85rem 1.4rem;border-radius:18px;
  min-height:64px;box-shadow:0 3px 10px rgba(10,102,217,.28);white-space:nowrap}
.copybtn:active{transform:scale(.97)}
.favbtn{font-size:1.5rem;width:56px;height:56px;border-radius:50%;background:#f4f4f7;color:#c2c2c8;flex-shrink:0}
.favbtn.on{color:#f5a300;background:#fff6dc}
.more{text-align:center;color:var(--sub);padding:12px;font-size:.9rem}

.empty{text-align:center;padding:30px 16px;color:var(--sub)}
.empty .big{font-size:3rem}
.examples{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.examples button{background:var(--card);padding:.6rem 1.2rem;border-radius:14px;font-weight:700;box-shadow:var(--shadow);color:var(--blue)}

/* ---------- 底部分頁 ---------- */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar .wrap{display:flex}
nav.tabbar button{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem;font-weight:700;color:#8a8a92}
nav.tabbar button .i{font-size:1.6rem;line-height:1.2}
nav.tabbar button.on{color:var(--blue)}
nav.tabbar button.add .i{background:var(--blue);color:#fff;width:2.2rem;height:2.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem}

.page{display:none}.page.on{display:block}

/* ---------- 表單 ---------- */
.form .card{padding:22px}
.field{margin-bottom:20px}
.field label{display:block;font-weight:800;margin-bottom:8px;font-size:1rem}
.field .hint{font-size:.8rem;color:var(--sub);font-weight:500;margin-left:6px}
.field input{width:100%;font:inherit;font-size:1.15rem;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:#fafafc;color:var(--text)}
.field input:focus{border-color:var(--blue);outline:0;background:#fff}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{flex:1;min-width:140px;padding:16px 10px;border-radius:16px;border:2px solid var(--line);background:#fafafc;font-weight:800}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.bigbtn{width:100%;background:var(--blue);color:#fff;font-size:1.2rem;font-weight:800;padding:18px;border-radius:18px;min-height:68px}
.bigbtn.gray{background:#e5e5ea;color:var(--text)}
.bigbtn:disabled{opacity:.5}
.msg{border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:600;display:none}
.msg.show{display:block}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}

.inv-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.inv-row:last-child{border-bottom:0}
.inv-row .c{font-family:"SF Mono",Consolas,monospace;font-weight:800;min-width:6.5em}
.inv-row .n{flex:1;font-size:.95rem}
.smallbtn{background:var(--blue-soft);color:var(--blue);font-weight:800;padding:.5rem .9rem;border-radius:12px;font-size:.9rem;white-space:nowrap}

/* ---------- 提示 ---------- */
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#1f8a43;color:#fff;font-size:1.2rem;font-weight:800;padding:18px 28px;border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:100;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast small{display:block;font-size:.9rem;font-weight:600;opacity:.9;margin-top:2px;font-family:"SF Mono",Consolas,monospace;letter-spacing:.05em}

#listen{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
#listen.show{display:flex}
#listen .box{background:#fff;border-radius:28px;padding:30px;text-align:center;width:min(420px,100%)}
#listen .mic{font-size:3.5rem;animation:pulse 1.2s infinite;border-radius:50%;width:110px;height:110px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--red-soft)}
#listen .heard{font-size:1.3rem;font-weight:800;min-height:2em;margin:8px 0 18px;color:var(--blue)}

dialog{border:0;border-radius:26px;padding:24px;width:min(520px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 12px}
dialog p{color:var(--sub);margin:6px 0}
dialog .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
dialog .row button{flex:1}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="topbar">
      <h1>📦 物品碼查詢</h1>
      <button class="pill-btn" id="fontBtn" aria-label="調整字體大小">字體 大</button>
      <button class="pill-btn" id="setBtn" aria-label="設定">⚙️</button>
    </div>
    <div id="searchArea">
      <div class="searchrow">
        <div class="searchbox">
          <span class="ico">🔍</span>
          <input id="q" type="search" placeholder="輸入品名或代碼" autocomplete="off" enterkeyhint="search">
          <button id="clearBtn" aria-label="清除">✕</button>
        </div>
        <button id="micBtn" aria-label="語音搜尋">🎤</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 查詢頁 -->
  <section class="page on" id="page-search">
    <div id="banner"></div>
    <div class="status" id="status"></div>
    <div id="results"></div>
  </section>

  <!-- 盤點頁（預留） -->
  <section class="page" id="page-inv">
    <h2 style="margin:14px 4px 6px">📋 盤點</h2>
    <div class="banner">🚧 盤點功能準備中。確認盤點方式後就會開放，目前先列出預計要盤點的物品。</div>
    <div id="invList"></div>
  </section>

  <!-- 新增頁 -->
  <section class="page form" id="page-add">
    <h2 style="margin:14px 4px 10px">＋ 新增物品</h2>
    <div class="msg" id="addMsg"></div>
    <div class="card">
      <div class="field">
        <label for="fCode">物品碼 <span class="hint">必填</span></label>
        <input id="fCode" autocomplete="off" autocapitalize="characters" placeholder="例如：TZKOTE">
      </div>
      <div class="field">
        <label for="fName">品名 <span class="hint">必填</span></label>
        <input id="fName" autocomplete="off" placeholder="例如：耳掛式手術用口罩">
      </div>
      <div class="field">
        <label>是哪一種？</label>
        <div class="seg" id="fSource">
          <button data-v="消耗性物品" class="on">消耗性物品<br><small>要填發貨部門</small></button>
          <button data-v="採購請購">採購請購<br><small>耗材、藥品</small></button>
        </div>
      </div>
      <div class="field" id="deptField">
        <label for="fDept">發貨部門代號</label>
        <input id="fDept" inputmode="numeric" autocomplete="off" placeholder="例如：8322">
        <div style="margin-top:10px" class="seg" id="deptQuick"></div>
      </div>
      <div class="field">
        <label for="fAlias">平常怎麼叫它？ <span class="hint">選填，方便搜尋</span></label>
        <input id="fAlias" autocomplete="off" placeholder="例如：口罩、小手套">
      </div>
      <div class="field" id="keyField" style="display:none">
        <label for="fKey">新增密碼 <span class="hint">第一次需要輸入</span></label>
        <input id="fKey" type="password" autocomplete="off" inputmode="numeric">
      </div>
      <button class="bigbtn" id="saveBtn">💾 儲存</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <div class="wrap">
    <button data-page="search" class="on"><span class="i">🔍</span>查詢</button>
    <button data-page="add" class="add"><span class="i">＋</span>新增物品</button>
    <button data-page="inv"><span class="i">📋</span>盤點</button>
  </div>
</nav>

<div id="toast"></div>

<div id="listen" role="dialog" aria-label="語音輸入中">
  <div class="box">
    <div class="mic">🎤</div>
    <div style="font-size:1.2rem;font-weight:800">請說出物品名稱</div>
    <div class="heard" id="heard"></div>
    <button class="bigbtn gray" id="stopListen">停止</button>
  </div>
</div>

<dialog id="dlg"></dialog>

<!-- 中文同音字比對（語音辨識打錯字時用），載入失敗也不影響基本功能 -->
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.5/dist/index.js" defer></script>

<script>
/* =========================================================
   設定：把 Google Apps Script 的網址貼在下面引號裡
   沒填的話，會先使用 items.json 的資料（只能查詢，新增只存在這台裝置）
   ========================================================= */
const CONFIG = {
  API_URL: '',
};
const VERSION = 'v1.0';

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 全形轉半形、小寫、去掉空白與標點
function norm(s){
  return String(s ?? '')
    .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/　/g, ' ')
    .toLowerCase()
    .replace(/[\s\-_.,，、。()（）\[\]【】\/\\*;；:：'"＂“”#+&]/g, '');
}

/* ---------- 資料 ---------- */
let ITEMS = [];          // 整理後的物品
let filter = 'all';
let lastSource = '';

function kindOf(it){
  if (it.source === '消耗性物品') return 'consume';
  return it.code.startsWith('*') ? 'drug' : 'supply';
}
const KIND = {
  consume:{label:'消耗性物品', cls:'consume'},
  supply:{label:'採購耗材', cls:'supply'},
  drug:{label:'藥品', cls:'drug'},
};

function toItem(r){
  const g = k => String(r[k] ?? '').trim();
  const depts = g('發貨部門').split(/[；;]/).map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(\S+)\s*(.*)$/); return { code:m[1], name:m[2] || '' };
  });
  const it = {
    code:g('物品碼'), name:g('品名'), source:g('來源') || '採購請購', depts,
    alias:g('別名'), old:g('舊品名'), inv:g('要盤點'), invCat:g('盤點分類'),
    safety:g('安全存量'), date:g('最近申請日'), local:!!r._local,
  };
  it.kind = kindOf(it);
  it.codeN = norm(it.code);
  it.hay = norm([it.code, it.name, it.alias, it.old, depts.map(d => d.code + d.name).join(' ')].join(' '));
  it.py = null;
  return it;
}

function setData(rows){
  const local = store.get('local_items', []);
  const seen = new Set(rows.map(r => String(r['物品碼']).trim()));
  const all = rows.concat(local.filter(r => !seen.has(String(r['物品碼']).trim())).map(r => ({...r, _local:true})));
  ITEMS = all.filter(r => String(r['物品碼'] ?? '').trim()).map(toItem);
  buildPinyin();
  renderChips(); render(); renderInv();
}

async function loadData(){
  const cache = store.get('items_cache', null);
  if (cache && cache.items) { lastSource = cache.when; setData(cache.items); }
  const url = CONFIG.API_URL || 'items.json';
  try {
    const res = await fetch(url, { cache:'no-store' });
    const data = await res.json();
    if (!data.items) throw new Error('no items');
    const when = new Date().toLocaleString('zh-TW', { hour12:false });
    store.set('items_cache', { items:data.items, when });
    lastSource = when;
    setData(data.items);
    $('#banner').innerHTML = CONFIG.API_URL ? '' :
      '<div class="banner">ℹ️ 尚未連接 Google 試算表，目前使用內建資料。新增的物品只會存在這台裝置。</div>';
  } catch (e) {
    $('#banner').innerHTML = '<div class="banner">📴 暫時連不上資料庫，先使用上次的資料' + (lastSource ? '（' + esc(lastSource) + '）' : '') + '。</div>';
    if (!cache) setData([]);
  }
}

/* ---------- 同音字（拼音）比對 ---------- */
const pyCache = new Map();
function charPy(ch){
  if (!window.pinyinPro) return null;
  if (!pyCache.has(ch)) {
    try { pyCache.set(ch, pinyinPro.pinyin(ch, { toneType:'none', type:'array', multiple:true }).map(s => s.replace(/v/g,'ü'))); }
    catch(e){ pyCache.set(ch, []); }
  }
  return pyCache.get(ch);
}
function buildPinyin(){
  if (!window.pinyinPro) return;
  ITEMS.forEach(it => {
    const set = new Set();
    for (const ch of (it.name + it.alias + it.old)) if (/[一-鿿]/.test(ch)) (charPy(ch) || []).forEach(p => set.add(p));
    it.py = set;
  });
}
window.addEventListener('load', () => {
  const t = setInterval(() => { if (window.pinyinPro) { clearInterval(t); buildPinyin(); if ($('#q').value) render(); } }, 300);
  setTimeout(() => clearInterval(t), 15000);
});

/* ---------- 搜尋 ---------- */
function units(qn){
  // 英數連在一起算一個單位，中文每個字一個單位
  return qn.match(/[a-z0-9]+|[^\sa-z0-9]/g) || [];
}
function scoreItem(it, q, tokens, qn){
  if (it.codeN === qn) return 1000;
  if (it.codeN.startsWith(qn) && qn.length >= 2) return 800 + qn.length;
  if (tokens.every(t => it.hay.includes(t))) {
    let s = 500;
    if (norm(it.name).includes(qn)) s += 60;
    if (norm(it.alias).includes(qn)) s += 50;
    return s - Math.min(it.name.length, 80) / 10;
  }
  // 模糊比對：輸入的字有六成以上出現在品名裡就算
  const us = units(qn);
  let total = 0, exact = 0, sound = 0;
  for (const u of us) {
    const isAscii = /^[a-z0-9]+$/.test(u);
    const w = isAscii ? Math.min(u.length, 4) : 1;
    total += w;
    if (it.hay.includes(u)) { exact += w; continue; }
    if (!isAscii && it.py) {
      const p = charPy(u);
      if (p && p.some(x => it.py.has(x))) sound += w * 0.7;
    }
  }
  if (total < 2) return 0;
  if (exact / total < 0.5) return 0;            // 至少一半的字要完全一樣
  const ratio = (exact + sound) / total;
  return ratio >= 0.6 ? Math.round(ratio * 300) : 0;   // 模糊結果最高 300 分
}

function search(q){
  const qn = norm(q);
  if (!qn) return null;
  const tokens = q.split(/\s+/).map(norm).filter(Boolean);
  const favs = new Set(store.get('favs', []));
  const order = { consume:0, supply:1, drug:2 };
  let list = ITEMS
    .filter(it => filter === 'all' || it.kind === filter)
    .map(it => ({ it, base: scoreItem(it, q, tokens, qn) }))
    .filter(x => x.base > 0);
  // 已經有完全符合的結果時，只留下非常接近的模糊結果，避免畫面太雜
  if (list.some(x => x.base >= 400)) list = list.filter(x => x.base >= 270);
  return list
    .map(x => ({ it: x.it, s: x.base + (favs.has(x.it.code) ? 30 : 0) }))
    .sort((a, b) => b.s - a.s || order[a.it.kind] - order[b.it.kind] || a.it.code.localeCompare(b.it.code))
    .map(x => x.it);
}

/* ---------- 畫面 ---------- */
function highlight(text, q){
  let html = esc(text);
  const words = q.split(/\s+/).filter(w => w.length >= 1).sort((a,b) => b.length - a.length);
  for (const w of words) {
    const re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    html = html.replace(re, '<mark>$1</mark>');
  }
  return html;
}

function cardHTML(it, q){
  const favs = new Set(store.get('favs', []));
  const k = KIND[it.kind];
  const deptHTML = it.kind === 'consume'
    ? (it.depts.length
        ? it.depts.map(d => `<button class="dept" data-copy-dept="${esc(d.code)}" title="點一下複製發貨部門代號">發貨部門 <b>${esc(d.code)}</b> ${esc(d.name)} 📋</button>`).join('')
        : '<span class="dept" style="opacity:.7">發貨部門：未填</span>')
    : '';
  return `<article class="card">
    <div class="tags"><span class="tag ${k.cls}">${k.label}</span>${it.local ? '<span class="tag local">只存在這台裝置</span>' : ''}${deptHTML}</div>
    <div class="name">${q ? highlight(it.name, q) : esc(it.name)}</div>
    ${it.alias ? `<div class="alias">別名：${esc(it.alias)}</div>` : ''}
    <div class="coderow">
      <div class="code"><small>物品碼</small>${esc(it.code)}</div>
      <button class="favbtn ${favs.has(it.code) ? 'on' : ''}" data-fav="${esc(it.code)}" aria-label="加入常用">★</button>
      <button class="copybtn" data-copy="${esc(it.code)}">📋 複製代碼</button>
    </div>
  </article>`;
}

function renderChips(){
  const c = { all:ITEMS.length, consume:0, supply:0, drug:0 };
  ITEMS.forEach(it => c[it.kind]++);
  const list = [['all','全部'],['consume','消耗性物品'],['supply','採購耗材'],['drug','藥品']];
  $('#chips').innerHTML = list.map(([k, l]) =>
    `<button class="chip ${filter === k ? 'on' : ''}" data-filter="${k}">${l}<span class="n">${c[k]}</span></button>`).join('');
}

const MAX = 60;
function render(){
  const q = $('#q').value.trim();
  $('#clearBtn').classList.toggle('show', !!q);
  const res = search(q);
  const box = $('#results');
  if (res === null) { renderHome(); return; }
  $('#status').textContent = res.length ? `找到 ${res.length} 項` : '';
  if (!res.length) {
    box.innerHTML = `<div class="empty"><div class="big">🤔</div>
      <p>找不到「${esc(q)}」</p><p style="font-size:.9rem">試試看少打幾個字，或換個說法。<br>找不到的物品可以按下方「＋ 新增物品」加進來。</p></div>`;
    return;
  }
  box.innerHTML = res.slice(0, MAX).map(it => cardHTML(it, q)).join('') +
    (res.length > MAX ? `<div class="more">還有 ${res.length - MAX} 項，請多打幾個字縮小範圍</div>` : '');
}

function renderHome(){
  const favs = store.get('favs', []), recent = store.get('recent', []);
  const byCode = new Map(ITEMS.map(it => [it.code, it]));
  const pass = it => it && (filter === 'all' || it.kind === filter);
  const favItems = favs.map(c => byCode.get(c)).filter(pass);
  const recItems = recent.map(c => byCode.get(c)).filter(it => pass(it) && !favs.includes(it.code)).slice(0, 8);
  $('#status').textContent = ITEMS.length ? `共 ${ITEMS.length} 項物品` + (lastSource ? `　·　資料更新於 ${lastSource}` : '') : '資料載入中…';
  let html = '';
  if (favItems.length) html += '<div class="section-title">⭐ 常用物品</div>' + favItems.map(it => cardHTML(it, '')).join('');
  if (recItems.length) html += '<div class="section-title">🕘 最近複製過</div>' + recItems.map(it => cardHTML(it, '')).join('');
  if (!html) html = `<div class="empty"><div class="big">🔍</div>
    <p style="font-size:1.1rem;font-weight:700;color:var(--text)">在上面輸入品名或代碼</p>
    <p>也可以按 🎤 用說的。<br>按 ★ 可以把常用的物品留在這一頁。</p>
    <div class="examples"><button data-ex="手套">手套</button><button data-ex="口罩">口罩</button><button data-ex="藥袋">藥袋</button><button data-ex="橡皮筋">橡皮筋</button></div></div>`;
  $('#results').innerHTML = html;
}

function renderInv(){
  const list = ITEMS.filter(it => it.inv === '是');
  if (!list.length) { $('#invList').innerHTML = '<div class="empty">還沒有設定要盤點的物品。<br>可以在 Google 試算表「要盤點」欄填「是」。</div>'; return; }
  const groups = {};
  list.forEach(it => (groups[it.invCat || '未分類'] ||= []).push(it));
  $('#invList').innerHTML = Object.entries(groups).map(([g, arr]) =>
    `<div class="section-title">${esc(g)}（${arr.length} 項）</div><div class="card">` +
    arr.map(it => `<div class="inv-row"><span class="c">${esc(it.code)}</span><span class="n">${esc(it.alias.split(' ')[0] || '')}<br><small style="color:var(--sub)">${esc(it.name)}</small></span>
      <button class="smallbtn" data-copy="${esc(it.code)}">📋 複製</button></div>`).join('') + '</div>').join('');
}

/* ---------- 複製 ---------- */
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 99999);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
let toastTimer;
function toast(main, sub, color){
  const t = $('#toast');
  t.style.background = color || '#1f8a43';
  t.innerHTML = esc(main) + (sub ? `<small>${esc(sub)}</small>` : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ---------- 事件 ---------- */
let debounce;
$('#q').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 120); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { render(); $('#q').blur(); } });
$('#clearBtn').addEventListener('click', () => { $('#q').value = ''; render(); $('#q').focus(); });

document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.copy) {
    const ok = await copyText(b.dataset.copy);
    if (ok) {
      toast('✅ 已複製代碼！', b.dataset.copy);
      const r = store.get('recent', []).filter(c => c !== b.dataset.copy); r.unshift(b.dataset.copy); store.set('recent', r.slice(0, 20));
    } else toast('⚠️ 複製失敗，請手動選取代碼', b.dataset.copy, '#c62828');
  } else if (b.dataset.copyDept) {
    const ok = await copyText(b.dataset.copyDept);
    toast(ok ? '✅ 已複製發貨部門！' : '⚠️ 複製失敗', b.dataset.copyDept, ok ? '#b25e00' : '#c62828');
  } else if (b.dataset.fav) {
    let f = store.get('favs', []);
    if (f.includes(b.dataset.fav)) { f = f.filter(c => c !== b.dataset.fav); toast('已從常用移除', b.dataset.fav, '#555'); }
    else { f.push(b.dataset.fav); toast('⭐ 已加入常用', b.dataset.fav, '#b88600'); }
    store.set('favs', f);
    $$(`[data-fav="${CSS.escape(b.dataset.fav)}"]`).forEach(x => x.classList.toggle('on', f.includes(b.dataset.fav)));
  } else if (b.dataset.filter) {
    filter = b.dataset.filter; renderChips(); render();
  } else if (b.dataset.ex) {
    $('#q').value = b.dataset.ex; render();
  } else if (b.dataset.page) {
    showPage(b.dataset.page);
  }
});

function showPage(p){
  $$('.page').forEach(x => x.classList.toggle('on', x.id === 'page-' + p));
  $$('nav.tabbar button').forEach(x => x.classList.toggle('on', x.dataset.page === p));
  $('#searchArea').style.display = p === 'search' ? '' : 'none';
  if (p === 'add') prepAdd();
  window.scrollTo(0, 0);
}

/* ---------- 字體大小 ---------- */
const FS = ['', 'fs-l', 'fs-xl'], FSL = ['字體 大', '字體 特大', '字體 標準'];
let fs = store.get('fs', 0);
function applyFs(){ document.documentElement.className = FS[fs]; $('#fontBtn').textContent = FSL[fs]; }
$('#fontBtn').addEventListener('click', () => { fs = (fs + 1) % 3; store.set('fs', fs); applyFs(); });
applyFs();

/* ---------- 語音 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$('#micBtn').addEventListener('click', () => {
  if (!SR) {
    dialog('🎤 這台裝置不支援網頁語音',
      '<p>可以改用鍵盤上的麥克風：點一下搜尋框，再按鍵盤上的 🎤 按鈕說話。</p>');
    return;
  }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = 'zh-TW'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
  $('#heard').textContent = '';
  $('#listen').classList.add('show'); $('#micBtn').classList.add('listening');
  rec.onresult = ev => {
    let txt = '';
    for (const r of ev.results) txt += r[0].transcript;
    txt = txt.replace(/[。，,.！？]$/, '');
    $('#heard').textContent = txt;
    $('#q').value = txt; render();
  };
  rec.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed')
      dialog('🎤 沒有麥克風權限', '<p>請在網址列左邊的圖示，把「麥克風」設成允許，再按一次 🎤。</p>');
    else if (ev.error === 'network')
      toast('⚠️ 語音需要連上網路', '', '#c62828');
  };
  rec.onend = () => { rec = null; $('#listen').classList.remove('show'); $('#micBtn').classList.remove('listening'); };
  try { rec.start(); } catch (e) { rec = null; $('#listen').classList.remove('show'); $('#micBtn').classList.remove('listening'); }
});
$('#stopListen').addEventListener('click', () => { if (rec) rec.stop(); });

/* ---------- 對話框 ---------- */
function dialog(title, html, buttons){
  const d = $('#dlg');
  d.innerHTML = `<h2>${title}</h2>${html}<div class="row">${(buttons || [['好', 'close']]).map(([l, a], i) =>
    `<button class="bigbtn ${i ? 'gray' : ''}" data-act="${a}">${l}</button>`).join('')}</div>`;
  d.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { d.close(); if (typeof b.dataset.act === 'string' && dialog.handlers[b.dataset.act]) dialog.handlers[b.dataset.act](); });
  d.showModal();
}
dialog.handlers = {};

/* ---------- 設定 ---------- */
$('#setBtn').addEventListener('click', () => {
  dialog.handlers.reload = () => { loadData(); toast('🔄 已重新載入資料'); };
  dialog.handlers.forget = () => { store.del('write_key'); toast('已清除新增密碼', '', '#555'); };
  dialog('⚙️ 設定',
    `<p>資料來源：${CONFIG.API_URL ? 'Google 試算表 ✅' : '內建資料（尚未連接 Google 試算表）'}</p>
     <p>物品數量：${ITEMS.length} 項</p>
     <p>上次更新：${esc(lastSource || '—')}</p>
     <p>語音搜尋：${SR ? '可以使用 ✅' : '這台裝置不支援，請用鍵盤麥克風'}</p>
     <p>同音字比對：${window.pinyinPro ? '已啟用 ✅' : '未載入'}</p>
     <p style="font-size:.8rem">版本 ${VERSION}</p>`,
    [['🔄 重新載入資料', 'reload'], ['清除新增密碼', 'forget'], ['關閉', 'close']]);
});

/* ---------- 新增物品 ---------- */
let fSource = '消耗性物品';
function prepAdd(){
  $('#keyField').style.display = CONFIG.API_URL && !store.get('write_key', '') ? '' : 'none';
  // 常見的發貨部門快速按鈕
  const cnt = {};
  ITEMS.forEach(it => it.depts.forEach(d => { const k = d.code + ' ' + d.name; cnt[k] = (cnt[k] || 0) + 1; }));
  $('#deptQuick').innerHTML = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 4)
    .map(([k]) => `<button type="button" data-dq="${esc(k)}">${esc(k)}</button>`).join('');
}
$('#fSource').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  fSource = b.dataset.v;
  $$('#fSource button').forEach(x => x.classList.toggle('on', x === b));
  $('#deptField').style.display = fSource === '消耗性物品' ? '' : 'none';
});
$('#deptQuick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $('#fDept').value = b.dataset.dq;
  $$('#deptQuick button').forEach(x => x.classList.toggle('on', x === b));
});
function addMsg(text, ok){ const m = $('#addMsg'); m.textContent = text; m.className = 'msg show ' + (ok ? 'ok' : 'err'); window.scrollTo(0, 0); }

$('#saveBtn').addEventListener('click', async () => {
  const code = $('#fCode').value.trim().toUpperCase().replace(/\s+/g, '');
  const name = $('#fName').value.trim();
  if (!code || !name) { addMsg('請填寫「物品碼」和「品名」'); return; }
  const exist = ITEMS.find(it => it.code === code);
  if (exist && !confirm(`物品碼 ${code} 已經有了：\n${exist.name}\n\n要用新的資料更新它嗎？`)) return;

  let dept = fSource === '消耗性物品' ? $('#fDept').value.trim() : '';
  if (dept && !/\s/.test(dept)) {
    const known = ITEMS.flatMap(it => it.depts).find(d => d.code === dept);
    if (known) dept = known.code + ' ' + known.name;
  }
  const item = { '物品碼':code, '品名':name, '來源':fSource, '發貨部門':dept, '別名':$('#fAlias').value.trim() };

  if (!CONFIG.API_URL) {
    const local = store.get('local_items', []).filter(r => r['物品碼'] !== code);
    local.push(item); store.set('local_items', local);
    finishAdd(code, '已儲存在這台裝置（尚未連接 Google 試算表）');
    setData(store.get('items_cache', { items:[] }).items);
    return;
  }
  const key = store.get('write_key', '') || $('#fKey').value.trim();
  if (!key) { $('#keyField').style.display = ''; addMsg('請輸入新增密碼'); $('#fKey').focus(); return; }
  $('#saveBtn').disabled = true; $('#saveBtn').textContent = '儲存中…';
  try {
    const res = await fetch(CONFIG.API_URL, { method:'POST', body:JSON.stringify({ action:'addItem', key, item }) });
    const data = await res.json();
    if (!data.ok) {
      if (data.error === '密碼錯誤') { store.del('write_key'); $('#keyField').style.display = ''; $('#fKey').value = ''; }
      addMsg('❌ ' + (data.error || '儲存失敗')); return;
    }
    store.set('write_key', key);
    finishAdd(code, data.updated ? '已更新到 Google 試算表' : '已新增到 Google 試算表');
    loadData();
  } catch (e) {
    addMsg('❌ 連不上 Google 試算表，請確認網路後再試一次');
  } finally {
    $('#saveBtn').disabled = false; $('#saveBtn').textContent = '💾 儲存';
  }
});
function finishAdd(code, text){
  ['#fCode', '#fName', '#fDept', '#fAlias', '#fKey'].forEach(s => $(s).value = '');
  $$('#deptQuick button').forEach(x => x.classList.remove('on'));
  $('#keyField').style.display = 'none';
  toast('✅ ' + text, code);
  addMsg('✅ ' + text + '：' + code, true);
}

/* ---------- 啟動 ---------- */
loadData();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
